<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NER Tower</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        background-color: #1a1a1a;
        color: white;
        font-family: sans-serif;
      }
      /* Phaser scales the canvas (Scale.FIT) to fill this box and centers it. The menu and
         game over panel are positioned relative to it. */
      #game-container {
        position: relative;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      #game-container canvas { box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
