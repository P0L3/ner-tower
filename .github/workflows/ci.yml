name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Includes the ruleset lock: it fails if anything that changes what a seed produces
      # was edited without bumping RULESET_VERSION (see docs/RULESET.md).
      - run: npm test
      - run: npm run build   # type-check + single-file build
